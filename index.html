<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
  <title>دعوة زفاف</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="viewport">
    <main id="main">
      <section class="panel" data-index="1">
        <img src="assets/images/1.jpeg" alt="invitation 1" loading="lazy" decoding="async">
        <div id="countdown" aria-hidden="false">
          <div class="count-inner">
            <div class="when">2026-08-19 18:30</div>
            <div class="parts">
              <div class="part"><div class="num" id="days">--</div><div class="label">Days</div></div>
              <div class="part"><div class="num" id="hours">--</div><div class="label">Hours</div></div>
              <div class="part"><div class="num" id="minutes">--</div><div class="label">Minutes</div></div>
              <div class="part"><div class="num" id="seconds">--</div><div class="label">Seconds</div></div>
            </div>
          </div>
        </div>
      </section>
      <section class="panel" data-index="2">
        <img src="assets/images/2.jpeg" alt="invitation 2" loading="lazy" decoding="async">
      </section>
      <section class="panel" data-index="3">
        <img src="assets/images/3.jpeg" alt="invitation 3" loading="lazy" decoding="async">
        <a id="map-overlay" class="map-overlay" href="https://www.google.com/maps/place/5WPQ%2B7CG+قاعة+اللوتس+نادي+الشرطة،+المعسكر,+Abis,+Moharam+Bek,+Alexandria+Governorate+5411450%E2%80%AD/@31.1874898,29.9391415,17z/data=!4m6!3m5!1s0x14f5c300634f5897:0xc547e49990f9b43c!8m2!3d31.1856863!4d29.9385729!16s%2Fg%2F11zch2f_pq?g_ep=Eg1tbF8yMDI2MDcyOF8wIOC7DCoASAJQAQ%3D%3D" target="_blank" aria-label="Open map"></a>
      </section>
    </main>

    <!-- countdown is moved into the first panel to overlay the first image -->

    <button id="maps-btn" aria-label="Open map">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z" stroke="#d4af37" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="music-popup" class="popup">
      <div class="popup-backdrop"></div>
      <div class="drop-ornament" aria-hidden="true"></div>
      <div class="popup-content" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <div class="welcome-copy">
          <span class="popup-sparkle" aria-hidden="true">✦</span>
          <p class="couple-names">Khaled &amp; Menna</p>
          <h1 id="welcome-title" class="welcome-title">Welcome to our</h1>
          <p class="celebration">celebration</p>
          <p class="popup-message">Tap to enter and enjoy the music</p>
        </div>
        <div class="gold-frame">
          <div class="icon">✿</div>
        </div>
        <h2 class="popup-title">اضغط لتشغيل الموسيقى</h2>
        <button id="start-btn" class="start">ابدأ</button>
      </div>
    </div>

  </div>

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.27/dist/lenis.min.js"></script>

  <script>
    // Detected audio file (injected by generator)
    const AUDIO_SRC = 'assets/audio/audioinvite.mp3';
  </script>
  <audio id="bg-audio" src="assets/audio/audioinvite.mp3" preload="auto" loop playsinline></audio>
  <script src="js/app.js"></script>
</body>
</html>
